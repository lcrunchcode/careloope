<style>
:root{--bg:#e3ddd1;--card:#fff;--card2:#f4f0e8;--ink:#1c1c1e;--mut:#6e6a63;--line:rgba(60,50,40,.14);--taupe:#7f6b64;--taupe-d:#6a5852;--slate:#6b7b92;--ok:#1f7a45;--okbg:#e3f2e8;--warn:#9a5b00;--warnbg:#fdf0d8;--bad:#c4271c;--badbg:#fbe4e1;--r:14px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:14px;position:relative}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:10px;object-fit:cover;display:block}
.lname{font-size:20px;font-weight:700;letter-spacing:-.4px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:0;background:var(--taupe);color:#fff;cursor:pointer}
.pill.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.drop{position:absolute;right:0;top:100%;margin-top:6px;width:250px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;z-index:50;display:none}
.drop .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.drop .v{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;margin-bottom:10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.45);padding:5px;border-radius:999px;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:9px 4px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--card);color:var(--ink)}
.chainbar{display:flex;flex-wrap:wrap;gap:6px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--mut)}
.chainbar b{color:var(--ink);font-weight:600;font-family:ui-monospace,Menlo,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
h2{font-size:22px;letter-spacing:-.4px;color:var(--slate);font-weight:600;margin-bottom:4px}
h3{font-size:15px;font-weight:600;margin-bottom:8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.m{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:720px){.m{grid-template-columns:repeat(4,1fr)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
.m .card{margin:0}
.big{font-size:30px;font-weight:600;letter-spacing:-.8px}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}.c-n{background:var(--card2);color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.bar{width:4px;align-self:stretch;border-radius:2px}
.grow{flex:1;min-width:0}
.small{font-size:12px;color:var(--mut)}
label.f{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font:inherit;font-size:15px;color:var(--ink)}
.btn{border:0;background:var(--taupe);color:#fff;padding:12px 18px;border-radius:999px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:var(--taupe-d)}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%;margin-top:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.msg{border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.warn{background:var(--warnbg);color:var(--warn)}
.tl{list-style:none}
.tl li{display:flex;gap:10px;padding:7px 0;align-items:flex-start}
.tl .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;margin-top:1px;border:1.5px solid var(--line);color:var(--mut)}
.tl .done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.tl .late .ic{background:var(--warn);border-color:var(--warn);color:#fff}
.tl a{color:var(--slate);font-size:12px}
.ar{direction:rtl;text-align:right;line-height:1.9}
#toast{position:fixed;left:12px;right:12px;bottom:14px;max-width:420px;margin:0 auto;background:#1c1c1e;color:#fff;border-radius:var(--r);padding:12px 14px;font-size:13px;display:none;z-index:99}
#toast a{color:#cfd8e6}
.foot{text-align:center;font-size:11px;color:var(--mut);padding:14px 0 30px;letter-spacing:.04em}
</style>
</head>

async function loadAgent(addr, retries=5){

  let eid=null; try{ const e=await settlement.lastEscrowId(); if(validEscrow(e)) eid=e; }catch(e){}

}
const recHash=(c,by,note,t,salt)=>ethers.keccak256(ethers.toUtf8Bytes(JSON.stringify([c.id,c.test,c.urgency,by,note,t])+salt));
async function run(a,id,c){
  if(a==="issue"){
    const ref=$("l-ref").value.trim(); if(!refOk(ref)){ setNote("lab","bad","Use a synthetic reference like PT-2041. Never enter real names or ID numbers."); return; }
    const n={id:nextId(),ref:ref,test:$("l-test").value,urgency:$("l-urg").value,owner:null,events:[]};
    let tx2=null, warn="";
    if(signer){
      if(!needChain("lab")) return;
      const slot=getSlot(); if(!slot){ setNote("lab","bad","No open slot. Ask the specialist to open one, or paste their slot code."); return; }
      let tx1; try{ setNote("lab","warn","Confirm the transactions in your wallet…"); tx1=await sendTx("Referral submitted", auction.submitBid(myAgent, slot.id, ethers.parseEther(BID_OG))); }catch(err){ setNote("lab","bad",errMsg(err)); return; }
      n.events.push({s:0,t:Date.now(),by:"Lab",tx:tx1});
      try{ const r=await holdFee(slot); tx2=r.tx; if(r.eid) n.escrowId=r.eid; }catch(err){ n.feePending=true; n.slot=slot; warn=" The referral is recorded but the fee was not held: "+errMsg(err); }
    } else n.events.push({s:0,t:Date.now(),by:"Lab",local:true});
    n.events.push({s:1,t:Date.now(),by:"System",tx:tx2,local:!tx2});
    cases.push(n); save(); pcase=n.id; selected=n.id; draft["l-ref"]=undefined;
    setNote("lab",warn?"warn":"ok","Case "+n.id+" created. "+(signer?(warn||"Referral and held fee are recorded on 0G."):"Saved in the app only. Connect a wallet to record on 0G."));
  }
  if(a==="fee"){
    if(!needChain(id)) return; const slot=c.slot||getSlot(); if(!slot){ setNote(id,"bad","Slot not found."); return; }
    try{ const r=await holdFee(slot); if(r.eid) c.escrowId=r.eid; const e1=c.events.find(e=>e.s===1); if(e1){ e1.tx=r.tx; e1.local=false; } c.feePending=false; save(); setNote(id,"ok","Fee held. Recorded on 0G."); }
    catch(err){ setNote(id,"bad",errMsg(err)); }
  }
  if(a==="slot"){
    if(!needChain("slot")) return;
    try{
      const name="gastro-slot-"+Date.now(), invId=ethers.keccak256(ethers.toUtf8Bytes(name));
      await sendTx("Slot opened", auction.listInventory(invId, myAgent, "careloop-slot-"+name, ethers.parseEther(BID_OG)));
      try{ localStorage.setItem("orvixa_inventoryId",invId); localStorage.setItem("orvixa_publisherAddr",myAddr); localStorage.setItem("orvixa_listedAt",String(Date.now())); }catch(e){}
      setNote("slot","ok","Slot open on 0G. The lab can now send a referral.");
    }catch(err){ setNote("slot","bad",errMsg(err)); }
  }
  if(a==="copy"){ const s_=localSlot(); if(!s_) return; const code=s_.id+"@"+s_.addr; try{ await navigator.clipboard.writeText(code); setNote("slot","ok","Slot code copied."); }catch(e){ prompt("Copy this slot code:",code); } }
  if(a==="acc"){ c.owner="Dr. Haddad"; addEv(c,3,c.owner,{local:true}); render(); }
  if(a==="rej"){ c.rejected=true; addEv(c,-1,"Dr. Haddad",{local:true,note:"Rejected"}); setNote(id,"warn","Rejected. The case now shows on the manager’s attention list."); }
  if(a==="reas"){ c.rejected=false; c.owner=null; addEv(c,-1,"Manager",{local:true,note:"Reassigned"}); render(); }
  if(a==="book"){ const d=dv("d-"+id,defDate()); if(!d||d<new Date().toISOString().slice(0,10)){ setNote(id,"bad","Choose an appointment date from today onwards."); return; } c.appt=d; addEv(c,4,c.owner,{local:true,note:d}); render(); }
  if(a==="att"){ addEv(c,5,c.owner,{local:true}); render(); }
  if(a==="close"){
    if(!has(c,6)){ setNote(id,"bad","The patient or the lab must confirm care was received first."); return; }
    const ev_=String(dv("n-"+id,"")).trim(), ok=!!dv("s-"+id,false);
    if(!ev_||!ok){ setNote(id,"bad","Add the evidence and tick the sign-off before closing."); return; }
    let tx=null, fp=null, extra="";
    const by=c.owner||"Clinician", tClose=Date.now(); let salt=null;
    if(signer && typeof ethers!=="undefined"){
      try{ salt=ethers.hexlify(ethers.randomBytes(16)); fp=await sendTx("Record fingerprint", signer.sendTransaction({to:myAddr,value:0,data:recHash(c,by,ev_,tClose,salt)})); }
      catch(err){ salt=null; extra=" The fingerprint was not recorded: "+errMsg(err); }
    }
    addEv(c,7,by,{t:tClose,tx:tx,fp:fp,salt:salt,local:!tx&&!fp,note:ev_}); draft["n-"+id]=undefined; draft["s-"+id]=undefined;
    setNote(id,extra?"warn":"ok","Signed off. Evidence and signer recorded."+(fp?" Fingerprint recorded.":"")+(c.escrowId?" The lab can now release the held fee.":"")+extra);
  }
  if(a==="confp"||a==="confl"){ addEv(c,6,a==="confp"?"Patient":"Lab",{local:true}); render(); }
  if(a==="verify"){
    const e=c.events.find(x=>x.s===7&&x.fp); if(!e||!e.salt){ setNote("v"+id,"warn","No fingerprint stored for this case."); return; }
    try{
      setNote("v"+id,"warn","Checking 0G…");
      const prov=provider||new ethers.JsonRpcProvider("https://evmrpc.0g.ai"), t=await prov.getTransaction(e.fp);
      const mine=recHash(c,e.by,e.note,e.t,e.salt);
      setNote("v"+id,t&&String(t.data).toLowerCase()===mine.toLowerCase()?"ok":"bad",t&&String(t.data).toLowerCase()===mine.toLowerCase()?"Verified. This record matches the fingerprint stored on 0G. It has not been changed.":"Mismatch. This record is different from the fingerprint stored on 0G.");
    }catch(err){ setNote("v"+id,"bad","Could not check 0G: "+errMsg(err)); }
  }
  if(a==="rel"){
    if(!needChain(id)) return;
    const e=c.events.find(x=>x.s===7); if(!e||!c.escrowId){ setNote(id,"bad","This case has no held fee to release."); return; }
    try{ setNote(id,"warn","Confirm the release in your wallet…"); const h=await sendTx("Fee released to specialist", settlement.releasePayment(c.escrowId)); e.tx=h; e.local=false; c.released=true; save(); setNote(id,"ok","Fee released. Recorded on 0G."); }
    catch(err){ setNote(id,"bad",errMsg(err)); }
  }
  if(a==="und"){ addEv(c,2,"Patient",{local:true}); render(); }
}
async function act(a,id){ if(busy) return; busy=true; try{ await run(a,id,cases.find(x=>x.id===id)); }catch(err){ setNote(id||"lab","bad",errMsg(err)); }finally{ busy=false; } }
function rec(e){ const k=e.target.dataset&&e.target.dataset.k; if(k) draft[k]=e.target.type==="checkbox"?e.target.checked:e.target.value; }
document.addEventListener("click",function(e){
  const t=e.target.closest("[data-act]");
  if(t){ const a=t.dataset.act;
    if(a==="sel"){ selected=t.dataset.id; render(); return; }
    if(a==="lang"){ lang=t.dataset.l; render(); return; }
    if(a==="pc") return; act(a,t.dataset.id); }
  const tb=e.target.closest("#tabs button"); if(tb){ view=tb.dataset.v; note={}; render(); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Enter"){ const r=e.target.closest&&e.target.closest('[data-act="sel"]'); if(r){ selected=r.dataset.id; render(); } } });
document.addEventListener("input",rec);
document.addEventListener("change",function(e){ rec(e); if(e.target.dataset&&e.target.dataset.act==="pc"){ pcase=e.target.value; render(); } });
window.addEventListener("load",function(){
  $("connect-wallet-btn").addEventListener("click",connectWallet);
  $("reset").addEventListener("click",function(){ if(confirm("Reset all demo cases to the starting data?")){ cases=seed(); save(); note={}; selected=null; pcase=null; render(); } });
  if(window.ethereum){
    window.ethereum.request({method:"eth_accounts"}).then(a=>{ if(a.length) connectWallet(); }).catch(()=>{});
    window.ethereum.on("accountsChanged",a=>{ if(a&&a.length) connectWallet(); else disconnectWallet(); });
    window.ethereum.on("chainChanged",()=>location.reload());
  }
  render();
});
</script>
</body>
