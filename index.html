<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareLoop — Screening-to-Care Dashboard</title>
<meta name="description" content="CareLoop tracks every actionable screening result to a documented, clinician-signed closure.">
<meta name="theme-color" content="#153679">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/ethers@6.13.5/dist/ethers.umd.min.js'"></script>
<style>
:root{--bg:#e3ddd1;--card:#fff;--card2:#f4f0e8;--ink:#1c1c1e;--mut:#6e6a63;--line:rgba(60,50,40,.14);--taupe:#7f6b64;--taupe-d:#6a5852;--slate:#6b7b92;--ok:#1f7a45;--okbg:#e3f2e8;--warn:#9a5b00;--warnbg:#fdf0d8;--bad:#c4271c;--badbg:#fbe4e1;--r:14px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:14px;position:relative}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:10px;object-fit:cover;display:block}
.lname{font-size:20px;font-weight:700;letter-spacing:-.4px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:0;background:var(--taupe);color:#fff;cursor:pointer}
.pill.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.drop{position:absolute;right:0;top:100%;margin-top:6px;width:250px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;z-index:50;display:none}
.drop .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.drop .v{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;margin-bottom:10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.45);padding:5px;border-radius:999px;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:9px 4px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--card);color:var(--ink)}
.chainbar{display:flex;flex-wrap:wrap;gap:6px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--mut)}
.chainbar b{color:var(--ink);font-weight:600;font-family:ui-monospace,Menlo,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
h2{font-size:22px;letter-spacing:-.4px;color:var(--slate);font-weight:600;margin-bottom:4px}
h3{font-size:15px;font-weight:600;margin-bottom:8px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.m{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:720px){.m{grid-template-columns:repeat(4,1fr)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
.m .card{margin:0}
.big{font-size:30px;font-weight:600;letter-spacing:-.8px}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}.c-n{background:var(--card2);color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.bar{width:4px;align-self:stretch;border-radius:2px}
.grow{flex:1;min-width:0}
.small{font-size:12px;color:var(--mut)}
label.f{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font:inherit;font-size:15px;color:var(--ink)}
.btn{border:0;background:var(--taupe);color:#fff;padding:12px 18px;border-radius:999px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:var(--taupe-d)}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%;margin-top:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.msg{border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.warn{background:var(--warnbg);color:var(--warn)}
.tl{list-style:none}
.tl li{display:flex;gap:10px;padding:7px 0;align-items:flex-start}
.tl .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;margin-top:1px;border:1.5px solid var(--line);color:var(--mut)}
.tl .done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.tl .late .ic{background:var(--warn);border-color:var(--warn);color:#fff}
.tl a{color:var(--slate);font-size:12px}
.ar{direction:rtl;text-align:right;line-height:1.9}
#toast{position:fixed;left:12px;right:12px;bottom:14px;max-width:420px;margin:0 auto;background:#1c1c1e;color:#fff;border-radius:var(--r);padding:12px 14px;font-size:13px;display:none;z-index:99}
#toast a{color:#cfd8e6}
.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;line-height:1;padding:3px 6px;margin-left:4px;vertical-align:middle}
@media(max-width:420px){.tabs button{font-size:12px;padding:9px 2px}.badge{font-size:10px;padding:2px 5px;margin-left:3px}}
.foot{text-align:center;font-size:11px;color:var(--mut);padding:14px 0 30px;letter-spacing:.04em}
/* ── tab motion ── */
.tabs{position:relative}
.tabs button{position:relative;z-index:1;transition:color .3s ease}
.tabs button.on{background:transparent;color:var(--ink)}
#tabind{position:absolute;top:5px;bottom:5px;left:0;width:0;background:var(--card);border-radius:999px;box-shadow:0 1px 4px rgba(60,50,40,.14);transition:transform .5s cubic-bezier(.32,.72,0,1),width .5s cubic-bezier(.32,.72,0,1);z-index:0;pointer-events:none;will-change:transform}
@keyframes viewIn{from{opacity:0;transform:translate3d(var(--dx,0px),10px,0)}to{opacity:1;transform:none}}
#view.enter{animation:viewIn .45s cubic-bezier(.32,.72,0,1) both}
.wrap{padding-bottom:88px}
/* ── assistant (glass) ── */
#ai-fab{position:fixed;right:16px;bottom:16px;z-index:60;height:48px;padding:0 18px 0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 8px 28px rgba(60,50,40,.2),inset 0 1px 0 rgba(255,255,255,.8);color:var(--ink);font:inherit;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .25s ease}
#ai-fab:hover{transform:translateY(-2px)}
#ai-fab.hide{transform:scale(.6);opacity:0;pointer-events:none}
#ai-fab svg,#ai-win svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#ai-win{position:fixed;right:16px;bottom:16px;z-index:61;width:340px;height:480px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.8);background:rgba(250,247,242,.72);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:0 24px 70px rgba(40,30,20,.28),inset 0 1px 0 rgba(255,255,255,.85);transform-origin:bottom right;opacity:0;transform:scale(.9) translateY(14px);visibility:hidden;pointer-events:none;transition:opacity .3s ease,transform .5s cubic-bezier(.32,.72,0,1),width .5s cubic-bezier(.32,.72,0,1),height .5s cubic-bezier(.32,.72,0,1),visibility 0s linear .5s}
#ai-win.open{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}
#ai-win.large{width:580px;height:min(80vh,740px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#ai-win{background:rgba(250,247,242,.98)}#ai-fab{background:rgba(255,255,255,.95)}}
.ai-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid rgba(60,50,40,.1)}
.ai-t{flex:1;min-width:0}.ai-t b{display:block;font-size:15px;letter-spacing:-.2px}
.ai-s{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.ai-s i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
#ai-win.off .ai-s i{background:#a39d96}
.ai-ib{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .3s cubic-bezier(.32,.72,0,1)}
.ai-ib:hover{background:rgba(255,255,255,.95)}.ai-ib:active{transform:scale(.92)}
#ai-banner{display:none;margin:10px 12px 0;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.7);font-size:12px;color:var(--mut)}
#ai-win.off #ai-banner{display:flex;justify-content:space-between;align-items:center;gap:8px}
#ai-banner button{border:0;background:none;color:var(--slate);font:inherit;font-weight:600;cursor:pointer;font-size:12px}
#ai-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.ai-msg{max-width:88%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.ai-msg.bot{align-self:flex-start;background:rgba(255,255,255,.85);border-bottom-left-radius:6px}
.ai-msg.me{align-self:flex-end;background:var(--taupe);color:#fff;border-bottom-right-radius:6px}
.ai-msg.new{animation:msgIn .4s cubic-bezier(.32,.72,0,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.ai-dots{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:rgba(255,255,255,.85);border-radius:18px}
.ai-dots span{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:dot 1.2s infinite ease-in-out}
.ai-dots span:nth-child(2){animation-delay:.15s}.ai-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.ai-cb{margin-top:8px;border:0;border-radius:999px;background:var(--taupe);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer}
#ai-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
#ai-chips::-webkit-scrollbar{display:none}
#ai-chips button{flex:none;border:1px solid rgba(60,50,40,.14);background:rgba(255,255,255,.7);color:var(--ink);border-radius:999px;font:inherit;font-size:12px;padding:6px 11px;cursor:pointer;transition:background .2s,transform .3s cubic-bezier(.32,.72,0,1)}
#ai-chips button:hover{background:#fff}#ai-chips button:active{transform:scale(.96)}
.ai-r{display:flex;gap:8px;padding:0 12px 8px}
#ai-input{flex:1;min-width:0;border:1px solid rgba(60,50,40,.14);border-radius:999px;background:rgba(255,255,255,.85);padding:10px 14px;font:inherit;font-size:16px;color:var(--ink)}
#ai-send{width:42px;height:42px;border-radius:50%;border:0;background:var(--taupe);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .2s}
#ai-send:active{transform:scale(.92)}#ai-send:disabled{opacity:.45}
.ai-f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 10px;font-size:11px;color:var(--mut)}
#ai-care{border:0;background:none;color:var(--slate);font:inherit;font-weight:600;font-size:12px;cursor:pointer;padding:0}
@media(max-width:520px){#ai-win{right:8px;bottom:8px;width:calc(100vw - 16px);height:58vh}#ai-win.large{width:calc(100vw - 16px);height:calc(100vh - 16px);height:calc(100dvh - 16px)}#ai-fab{right:12px;bottom:12px}}
@media(prefers-reduced-motion:reduce){#tabind,#ai-win,#ai-fab,.ai-ib,#ai-send,#ai-chips button{transition:none!important}#view.enter,.ai-msg.new,.ai-dots span{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div class="logo"><img class="mark" src="/icons/logo-128.png" alt="CareLoop logo" width="38" height="38"><div><div class="lname">CareLoop</div><div class="eyebrow">Screening to care</div></div></div>
  <div style="display:flex;gap:8px;align-items:center">
   <span class="pill ghost"><span class="dot"></span>0G Mainnet</span>
   <div id="wallet-container" style="position:relative">
    <button id="connect-wallet-btn" class="pill">Connect wallet</button>
    <div id="connected-profile-ui" style="display:none"><button class="pill" onclick="toggleDropdown()"><span class="dot" style="background:#fff"></span><span id="header-address">0x…</span></button>
     <div id="profile-dropdown" class="drop"><div class="k">Balance</div><div class="v" id="ui-balance">0 OG</div><div class="k">Wallet address</div><div class="v" id="full-address">0x…</div><button class="btn sec" style="width:100%" onclick="disconnectWallet()">Disconnect</button></div></div>
   </div>
  </div>
 </div>

 <div class="tabs" id="tabs"><span id="tabind" aria-hidden="true"></span><button data-v="mgr" class="on">Manager</button><button data-v="lab">Lab</button><button data-v="spec">Specialist</button><button data-v="pat">Patient</button></div>

 <div class="chainbar">
  <span>Agent ID <b id="cb-agentid">—</b></span><span>Reputation <b id="cb-reputation">—</b></span>
  <span>Contract balance <b id="cb-escrow">—</b></span><span>Wallet <b id="cb-balance">—</b></span>
  <span>Network <b>0G · 16661</b></span>
  <span id="regwrap" style="display:none"><button class="pill" onclick="handleRegister()">Register this wallet on 0G</button></span>
 </div>

 <div id="view"></div>
 <div class="foot">DEMO · SYNTHETIC PATIENTS ONLY · NO PERSONAL DATA IS EVER WRITTEN TO THE BLOCKCHAIN<br><button class="pill ghost" id="reset" style="margin-top:10px">Reset demo data</button></div>
</div>
<div id="toast" role="status" aria-live="polite"><span id="toast-title"></span> <span id="toast-hash" style="font-family:ui-monospace,monospace"></span> · <a id="toast-link" href="#" target="_blank" rel="noopener">View on 0G Explorer</a></div>

if (typeof ethers === "undefined") {

}

        const AUCTION_ADDRESS = "0x108274F7151BA879A03D5b1Fe525745Cf71695fF";
        const SETTLEMENT_ADDRESS = "0x555b3d16810Bfbd0Da5dFBFF4E07B576f4EDd3d1";

          { "anonymous": false, "inputs": [{ "indexed": true, "internalType": "bytes32", "name": "agentId", "type": "bytes32" }, { "indexed": true, "internalType": "address", "name": "ownerAddress", "type": "address" }, { "indexed": false, "internalType": "string", "name": "metadataCid", "type": "string" }, { "indexed": false, "internalType": "uint256", "name": "timestamp", "type": "uint256" }], "name": "AgentRegistered", "type": "event" },

/* ───────── SMART MONITOR, TRACKERS AND AI EXPLANATIONS ───────── */
const TABS={mgr:"Manager",lab:"Lab",spec:"Specialist",pat:"Patient"};
const evT=(c,s)=>{ const e=c.events.filter(x=>x.s===s).pop(); return e?e.t:null; };
const hrsSince=t=>Math.max(0,Math.round((Date.now()-t)/H));
const apptPast=c=>!!c.appt&&c.appt<new Date().toISOString().slice(0,10);
const SEV={high:{l:"Urgent",c:"c-bad",col:"var(--bad)"},med:{l:"Attention",c:"c-warn",col:"var(--warn)"},low:{l:"Info",c:"c-n",col:"var(--mut)"}};

/* The monitor: plain rules, each flag says why and who must act. No hidden scoring. */
function flags(){
  const out=[], now=Date.now();
  cases.forEach(c=>{
    const f=(type,sev,role,title,why,act,t)=>out.push({key:c.id+":"+type,cid:c.id,type:type,sev:sev,role:role,title:title,why:why,act:act,hrs:hrsSince(t||last(c))});
    if(has(c,7)){ if(c.escrowId&&!c.released&&now-evT(c,7)>6*H) f("fee","med","Lab","Fee not released","Care is signed off, but the held fee has not been released for over 6 hours.","Lab: release the held fee.",evT(c,7)); return; }
    if(c.rejected){ f("rejected","high","Manager","Referral rejected","The specialist rejected this referral, so nobody owns the case.","Manager: return it to the queue and assign another specialist."); return; }
    if(c.help) f("help","high","Manager","Patient asked for help","The patient used the help button and is waiting for a reply.","Specialist or manager: contact the patient, then mark it handled.");
    const sla=SLA_H[c.urgency]*H, since=now-last(c);
    if(!has(c,3)&&since>sla) f("noowner",c.urgency==="Urgent"?"high":"med","Specialist","No clinician has taken this case",c.urgency+" result waiting "+hrsSince(last(c))+" h with no owner (rule: "+SLA_H[c.urgency]+" h).","Specialist: accept or reject. If nobody responds, escalate to the on-call lead.");
    if(has(c,1)&&!has(c,2)&&now-evT(c,1)>24*H) f("noack","med","Lab","Patient has not confirmed understanding","No “I understand” after "+hrsSince(evT(c,1))+" h, so the patient may not have seen the message.","Lab: call the patient or resend the message in their language.",evT(c,1));
    if(has(c,3)&&!has(c,4)&&since>sla) f("nobook","med","Specialist","Appointment not booked","Accepted "+hrsSince(evT(c,3))+" h ago but no appointment exists (rule: "+SLA_H[c.urgency]+" h).","Specialist: book the appointment.",evT(c,3));
    if(has(c,4)&&!has(c,5)&&apptPast(c)) f("missed","high","Specialist","Possible missed appointment","The appointment date ("+c.appt+") has passed and no attendance is recorded.","Specialist: contact the patient and rebook, or mark attended if they came.",new Date(c.appt+"T23:59:00").getTime());
    if(has(c,5)&&!has(c,6)&&now-evT(c,5)>24*H) f("noconf","med","Patient","Care not yet confirmed","The visit was recorded "+hrsSince(evT(c,5))+" h ago but nobody has confirmed care was received.","Patient: tap “I received my care”. Lab: confirm if you know.",evT(c,5));
    if(has(c,6)&&!has(c,7)&&now-evT(c,6)>24*H) f("nosign","med","Specialist","Waiting for clinician sign-off","Care is confirmed but the clinician has not signed off after "+hrsSince(evT(c,6))+" h.","Specialist: add the evidence and sign off.",evT(c,6));
  });
  labs.forEach(l=>{ if(l.status==="pending"&&now>l.due) out.push({key:l.id+":lab",cid:null,type:"lab",sev:"med",role:"Lab",title:"Lab result overdue",why:"The result for "+l.ref+" was expected "+hrsSince(l.due)+" h ago and has not arrived.",act:"Lab: chase the sample or the analyser queue.",hrs:hrsSince(l.due)}); });
  const rank={high:0,med:1,low:2}; out.sort((a,b)=>(rank[a.sev]-rank[b.sev])||(b.hrs-a.hrs)); return out;
}
function flagItem(f){
  const s=SEV[f.sev];
  return '<div class="row" style="cursor:default;align-items:flex-start"><div class="bar" style="background:'+s.col+'"></div><div class="grow"><div><b>'+esc(f.title)+'</b>'+(f.cid?' · '+esc(f.cid):'')+'</div><div class="small">'+esc(f.why)+'</div><div class="small" style="color:var(--ink)">→ '+esc(f.act)+'</div>'
   +(f.type==="help"?'<div style="margin-top:6px"><button class="btn sec" data-act="helpdone" data-id="'+esc(f.cid)+'">Mark handled</button></div>':'')+'</div><span class="chip '+s.c+'">'+s.l+'</span></div>';
}
function monitorCard(){
  const L=flags();
  return '<div class="card"><h3>Referral monitor · '+L.length+' alert'+(L.length===1?'':'s')+'</h3><div class="small" style="margin-bottom:6px">Checked against clear time rules. Each alert says why and who acts. Ask the assistant (bottom right) if anything is unclear.</div>'+(L.length?L.map(flagItem).join(''):'<div class="small">No delays, missed appointments or incomplete handoffs right now.</div>')+'</div>';
}
function actionsCard(role,cid){
  const L=flags().filter(f=>f.role===role&&(role!=="Patient"||f.cid===cid));
  return '<div class="card"><h3>Your actions · '+L.length+'</h3>'+(L.length?L.map(flagItem).join(''):'<div class="small">Nothing is waiting for you.</div>')+'</div>';

function tabCount(v,fl){ return v==="mgr"?fl.filter(f=>f.sev==="high").length:fl.filter(f=>f.role===TABS[v]).length; }


/* Closure checklist */
function closureHtml(c){
  const e7=c.events.filter(e=>e.s===7).pop(), e6=c.events.filter(e=>e.s===6).pop();
  const it=[
   ["Evidence of care recorded", e7&&e7.note?"ok":"todo",""],
   ["Care confirmed by "+(e6?e6.by:"patient or lab"), e6?"ok":"todo",""],
   ["Clinician sign-off"+(e7?" by "+e7.by:""), e7?"ok":"todo",""],
   ["Fingerprint on 0G", e7&&e7.fp?"ok":(e7?"na":"todo"), e7&&!e7.fp?"not recorded (app only)":""],
   ["Fee released", c.released?"ok":(!c.escrowId?"na":"todo"), !c.escrowId?"no fee held for this case":""]
  ];
  const app=it.filter(x=>x[1]!=="na"), done=app.filter(x=>x[1]==="ok").length, complete=done===app.length;
  return '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">Closure checklist</b><span class="chip '+(complete?'c-ok':'c-warn')+'">'+(complete?'Closure complete':'Incomplete · '+done+' of '+app.length)+'</span></div><ul class="tl">'
   +it.map(x=>'<li class="'+(x[1]==="ok"?'done':'')+'"><div class="ic">'+(x[1]==="ok"?'✓':x[1]==="na"?'–':'')+'</div><div class="grow"><div>'+esc(x[0])+'</div>'+(x[2]?'<div class="small">'+esc(x[2])+'</div>':'')+'</div></li>').join('')+'</ul></div>';
}

/* Simulated notifications, derived from what happened in each case */
function notifs(c){
  const L=[], ev=s=>c.events.filter(e=>e.s===s)[0];
  const e1=ev(1); if(e1) L.push({t:e1.t,ch:"SMS",text:"Result message sent in English and Arabic"});
  const e3=ev(3); if(e3) L.push({t:e3.t,ch:"App",text:(c.owner||"A specialist")+" has accepted your case"});
  const e4=ev(4); if(e4){ L.push({t:e4.t,ch:"SMS",text:"Appointment confirmed for "+(c.appt||"the booked date")});
    if(c.appt&&!has(c,5)){ const rt=new Date(c.appt+"T09:00:00").getTime()-864e5; if(rt>Date.now()) L.push({t:rt,ch:"SMS",text:"Reminder: appointment tomorrow",sched:true}); } }
  if(has(c,4)&&!has(c,5)&&apptPast(c)) L.push({t:new Date(c.appt+"T18:00:00").getTime(),ch:"SMS",text:"We missed you on "+c.appt+". Please call to rebook."});
  const e5=ev(5); if(e5&&!has(c,6)) L.push({t:e5.t,ch:"App",text:"Please confirm you received your care"});
  const e7=ev(7); if(e7) L.push({t:e7.t,ch:"SMS",text:"Your care is complete. Thank you"});
  const h=c.events.filter(e=>e.note==="Asked for help").pop(); if(h) L.push({t:h.t,ch:"App",text:"Your help request was sent to the care team"});
  return L.sort((a,b)=>b.t-a.t);
}
const notifRow=(n,id)=>'<div class="row" style="cursor:default"><div class="grow">'+(id?esc(id)+' · ':'')+esc(n.text)+'<div class="small">'+n.ch+' · '+(n.sched?'scheduled':ago(n.t))+'</div></div><span class="chip '+(n.sched?'c-n':'c-ok')+'">'+(n.sched?'Queued':'Sent')+'</span></div>';
function notifLogCard(){
  const all=[]; cases.forEach(c=>notifs(c).forEach(n=>all.push({n:n,id:c.id}))); all.sort((a,b)=>b.n.t-a.n.t);
  return '<div class="card"><h3>Notification log</h3><div class="small" style="margin-bottom:6px">Simulated. No real SMS or app messages are sent in this prototype.</div>'+(all.slice(0,8).map(x=>notifRow(x.n,x.id)).join('')||'<div class="small">No messages yet.</div>')+'</div>';
}
function notifCard(c){
  const L=notifs(c);
  return '<div class="card"><h3>Messages you would receive</h3><div class="small" style="margin-bottom:6px">Simulated. No real messages are sent.</div>'+(L.map(n=>notifRow(n)).join('')||'<div class="small">No messages yet.</div>')+'</div>';
}

/* Patient care navigator */
function navigatorCard(c){
  const steps=["Result","Specialist","Appointment","Visit","Complete"];
  const done=has(c,7)?5:has(c,5)?4:has(c,4)?3:has(c,3)?2:1;
  const o=c.owner||"Your specialist";
  let who,next;
  if(!has(c,3)){ who="Waiting for a specialist (your lab is watching)"; next="A specialist will accept your case."; }
  else if(!has(c,4)){ who=o; next="Your appointment will be booked."; }
  else if(!has(c,5)){ who=o; next="Attend your appointment"+(c.appt?" on "+c.appt:"")+"."; }
  else if(!has(c,6)){ who="You or your lab"; next="Tap “I received my care” below."; }
  else if(!has(c,7)){ who=o; next="Your clinician signs off your case."; }
  else { who="Nobody. Your care loop is closed"; next="You are all set."; }
  return '<div class="card"><h3>Your care journey</h3><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'
   +steps.map((s,i)=>'<span class="chip '+(i<done?'c-ok':i===done?'c-warn':'c-n')+'">'+(i<done?'✓ ':'')+s+'</span>').join('')+'</div>'
   +'<div class="small">Who is responsible now</div><div style="margin-bottom:6px"><b>'+esc(who)+'</b></div><div class="small">Next step</div><div style="margin-bottom:8px"><b>'+esc(next)+'</b></div>'
   +(c.help?'<div class="msg ok">Your care team has been told and will contact you.</div>':(has(c,7)?'':'<button class="btn sec full" data-act="help" data-id="'+c.id+'">I need help</button>'))+'</div>';

/* ───────── TAB MOTION ───────── */
const reduceMotion=()=>!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const ORDER=["mgr","lab","spec","pat"];
function placeInd(instant){
  const ind=$("tabind"), b=document.querySelector("#tabs button.on"); if(!ind||!b) return;
  const snap=instant||!ind.dataset.ready||reduceMotion();
  if(snap) ind.style.transition="none";
  ind.style.width=b.offsetWidth+"px"; ind.style.transform="translateX("+b.offsetLeft+"px)";
  if(snap){ void ind.offsetWidth; ind.style.transition=""; ind.dataset.ready="1"; }
}
function animateView(dir){
  const v=$("view"); if(!v||reduceMotion()) return;
  v.style.setProperty("--dx",(dir>0?18:-18)+"px"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
  clearTimeout(animateView.t); animateView.t=setTimeout(function(){ v.classList.remove("enter"); },520);
}
function switchTab(v){
  if(v===view){ note={}; render(); return; }
  const dir=ORDER.indexOf(v)-ORDER.indexOf(view); view=v; note={}; render(); animateView(dir);
}

 lab:"You are on the Lab tab.\n• “Issue result and send referral” creates a case and holds a small fee on 0G. Use a made-up reference like PT-2041.\n• “Pending lab results” tracks results you are waiting for. “Mark received”, then “Use in form”, fills the issue form.\n• “Confirm care was received” is one of the two confirmations needed before sign-off.\n• “Release the held fee” pays the specialist after sign-off. Only this lab’s wallet can do it.\n• “Hold the fee now” retries a fee that did not lock.",
 spec:"You are on the Specialist tab.\n• “Open an appointment slot on 0G” makes a slot the lab can refer into.\n• “Accept” takes ownership of a case. “Reject” sends it back to the manager.\n• “Book appointment”, then “Mark as attended”.\n• “Sign off and close” needs your evidence text, the tick box, and care already confirmed by the patient or lab.\n• “Return to queue for reassignment” reopens a rejected case.",
 pat:"You are on the Patient tab.\n• Switch between English and العربية to read the result message.\n• “I understand” tells the care team you read it.\n• “I received my care” confirms your visit happened.\n• “I need help” alerts the care team.\n• Your care journey shows who is responsible now and what happens next. You pay nothing in this app."
};
function alertsAnswer(){
  const L=flags().slice(0,5);
  if(!L.length) return "There are no alerts right now. The monitor checks for delayed results, unbooked or missed appointments, patients who have not confirmed, unconfirmed care, and unreleased fees.";
  return "Current alerts:\n"+L.map(function(f){ return "• "+f.title+(f.cid?" ("+f.cid+")":"")+": "+f.why+" Next: "+f.act; }).join("\n");
}
const FAQ=[
 {q:"What can I do on this screen?",k:/screen|button|what can i do|this page|which tab|how do i use/i,a:function(){ return TAB_HELP[view]; }},
 {q:"Why is there an alert?",k:/alert|flag|overdue|late|missed|monitor|warning/i,a:alertsAnswer},
 {q:"What do the case steps mean?",k:/step|stage|journey|status/i,a:function(){ return "A case moves through eight steps: Result issued, Patient notified, Patient understood, Referral accepted, Appointment booked, Attended, Care confirmed, and Closed with sign-off. Each step has a named owner and a time."; }},
 {q:"How does payment work?",k:/pay|fee|escrow|money|token|\bog\b/i,a:function(){ return "The lab holds a small fee (0.001 OG in the demo) in escrow on 0G when it sends a referral. It is released to the specialist only after care is confirmed and a clinician signs off. Only the lab’s wallet can release it. The patient pays nothing in this app."; }},
 {q:"Why can’t I close a case?",k:/close|sign.?off|closing/i,a:function(){ return "Closing needs three things: care confirmed by the patient or the lab, your evidence text, and the sign-off box ticked. If care is not confirmed yet, ask the patient to tap “I received my care”, or confirm it on the Lab tab."; }},
 {q:"Wallet says “Not registered”",k:/regist|agent id/i,a:function(){ return "Each wallet registers once on 0G. Tap “Register this wallet on 0G” in the bar under the tabs and approve it in MetaMask. You need a little OG for the network fee."; }},
 {q:"Why can’t the specialist release the fee?",k:/only the agent|only the wallet|release funds|can.?t release/i,a:function(){ return "The fee can only be released by the wallet that held it, which is the Lab account. Switch MetaMask to the Lab account, open the Lab tab, and tap “Release the held fee”."; }},
 {q:"Where is my data stored?",k:/data|privacy|stored|blockchain|personal|on.?chain|safe/i,a:function(){ return "Demo cases are made up and stay in your own browser. Only transaction times, a hash fingerprint and wallet addresses go on the 0G blockchain, never names or health details."; }},
 {q:"My cases are missing on another device",k:/device|missing|disappear|phone|laptop|another browser|lost/i,a:function(){ return "Case progress is saved per browser, not on a shared server, in this prototype. Use the same browser for every role, or tap “Reset demo data” to restore the starter cases."; }}
];
function localAnswer(t){ const f=FAQ.find(function(x){ return x.q.toLowerCase()===t.toLowerCase(); })||FAQ.find(function(x){ return x.k.test(t); }); return f?f.a():null; }
function chatSummary(){ return "CareLoop assistant chat\n"+chat.msgs.map(function(m){ return (m.r==="u"?"Me: ":"Assistant: ")+redact(m.t); }).join("\n"); }

function chatDraw(){
  const list=$("ai-list"); if(!list) return; list.textContent="";
  const mk=function(cls,text,isNew){ const d=document.createElement("div"); d.className="ai-msg "+cls+(isNew?" new":""); d.textContent=text; return d; };
  if(!chat.msgs.length) list.appendChild(mk("bot",INTRO,false));
  chat.msgs.forEach(function(m){
    const d=mk(m.r==="u"?"me":"bot",m.t,!m.shown); m.shown=true;
    if(m.act==="copy"){ const b=document.createElement("button"); b.className="ai-cb"; b.dataset.aiact="copy"; b.textContent="Copy summary"; d.appendChild(document.createElement("br")); d.appendChild(b); }
    list.appendChild(d);
  });
  if(chat.busy){ const t=document.createElement("div"); t.className="ai-dots"; t.setAttribute("aria-label","The assistant is typing"); t.innerHTML="<span></span><span></span><span></span>"; list.appendChild(t); }
  $("ai-win").classList.toggle("off",chat.offline);
  $("ai-status").textContent=chat.offline?"Offline · common questions available":"Online";
  $("ai-send").disabled=chat.busy;
  list.scrollTop=list.scrollHeight;
}
const redact=function(t){ return String(t).replace(/\bPT-\d{3,6}\b/gi,"[ref]").replace(/#\d{4}\b/g,"[case]").replace(/0x[0-9a-fA-F]{8,}/g,"[hash]"); };
function pushMsg(r,t,act,local){ chat.msgs.push({r:r,t:t,act:act,local:!!local}); chatDraw(); }
function chatOpen(v){
  chat.open=v; $("ai-win").classList.toggle("open",v); $("ai-fab").classList.toggle("hide",v);
  $("ai-fab").setAttribute("aria-expanded",String(v)); $("ai-win").setAttribute("aria-hidden",String(!v));
  if(v) setTimeout(function(){ const i=$("ai-input"); if(i&&chat.open) i.focus({preventScroll:true}); },350); else { const f=$("ai-fab"); if(f) f.focus({preventScroll:true}); }
}
function chatSize(l){
  chat.large=l; $("ai-win").classList.toggle("large",l);
  const b=$("ai-size"); b.setAttribute("aria-label",l?"Make the window smaller":"Make the window larger"); b.title=b.getAttribute("aria-label");
  b.innerHTML=l?'<svg viewBox="0 0 24 24"><path d="M10 4v6H4M14 20v-6h6M10 10L3 3M14 14l7 7"/></svg>':'<svg viewBox="0 0 24 24"><path d="M9 3H3v6M15 21h6v-6M3 3l7 7M21 21l-7-7"/></svg>';
}
async function chatSend(text){
  text=String(text||"").trim().slice(0,400); if(!text||chat.busy) return;
  pushMsg("u",text);
  const faq=FAQ.find(function(x){ return x.q.toLowerCase()===text.toLowerCase(); });
  if(faq){ pushMsg("a",faq.a(),null,true); return; }
  if(chat.offline||(typeof navigator!=="undefined"&&navigator.onLine===false)){ chat.offline=true; pushMsg("a",localAnswer(text)||CALM,null,true); return; }
  chat.busy=true; chatDraw();
  try{
    const hist=chat.msgs.filter(function(m){ return !m.act&&!m.local; }).slice(-8).map(function(m){ return {role:m.r==="u"?"user":"assistant",text:redact(m.t).slice(0,500)}; });
    const ctx={tab:view,alerts:flags().slice(0,6).map(function(f){ return {type:f.type,sev:f.sev,role:f.role,hours:f.hrs||0}; })};
    const ctl=new AbortController(), tm=setTimeout(function(){ ctl.abort(); },15000);
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist,context:ctx}),signal:ctl.signal});
    clearTimeout(tm); const j=await r.json().catch(function(){ return {}; });
    if(!r.ok||!j.text) throw new Error("unavailable");
    chat.busy=false; pushMsg("a",j.text);
  }catch(e){
    chat.busy=false; chat.offline=true; const l=localAnswer(text);
    pushMsg("a",l?l+"\n\n(From the built-in guide while the assistant rests.)":CALM,null,true);
  }
}
function initChat(){
  if($("ai-win")) return;
  document.body.insertAdjacentHTML("beforeend",
   '<button id="ai-fab" aria-label="Ask AI" aria-expanded="false" aria-controls="ai-win"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Ask AI</button>'
  +'<section id="ai-win" role="dialog" aria-label="CareLoop assistant" aria-hidden="true">'
  +'<div class="ai-h"><div class="ai-t"><b>CareLoop assistant</b><div class="ai-s"><i></i><span id="ai-status">Online</span></div></div>'
  +'<button class="ai-ib" id="ai-size" type="button"></button>'
  +'<button class="ai-ib" id="ai-close" type="button" aria-label="Close the assistant" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
  +'<div id="ai-banner"><span>The assistant is resting. Common questions still work.</span><button type="button" id="ai-retry">Try again</button></div>'
  +'<div id="ai-list" aria-live="polite"></div><div id="ai-chips"></div>'
  +'<div class="ai-r"><input id="ai-input" maxlength="400" autocomplete="off" placeholder="Ask about CareLoop…" aria-label="Your question"><button id="ai-send" type="button" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>'
  +'<div class="ai-f"><button id="ai-care" type="button">Talk to a person</button><span>Not medical advice</span></div></section>');
  $("ai-chips").innerHTML=FAQ.map(function(f,i){ return '<button type="button" data-aifaq="'+i+'">'+f.q+'</button>'; }).join("");
  chatSize(false); chatDraw();
  $("ai-fab").addEventListener("click",function(){ chatOpen(true); });
  $("ai-close").addEventListener("click",function(){ chatOpen(false); });
  $("ai-size").addEventListener("click",function(){ chatSize(!chat.large); });
  $("ai-retry").addEventListener("click",function(){ chat.offline=false; chatDraw(); });
  $("ai-send").addEventListener("click",function(){ const i=$("ai-input"), v=i.value; i.value=""; chatSend(v); });
  $("ai-input").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); const v=e.target.value; e.target.value=""; chatSend(v); } });
  $("ai-chips").addEventListener("click",function(e){ const b=e.target.closest("[data-aifaq]"); if(b) chatSend(FAQ[+b.dataset.aifaq].q); });
  $("ai-list").addEventListener("click",function(e){
    if(e.target.dataset&&e.target.dataset.aiact==="copy"){
      const t=chatSummary();
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ e.target.textContent="Copied"; },function(){ window.prompt("Copy this summary:",t); });
    }
  });
  $("ai-care").addEventListener("click",function(){ pushMsg("a","Customer care chat is coming soon. For now, tap “Copy summary” to save this conversation so you can share it with your team.","copy",true); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&chat.open) chatOpen(false); });
}

/* ───────── ACTIONS ───────── */
let busy=false;
const refOk=t=>/^[A-Za-z]{2,4}-\d{3,6}$/.test(t);
const nextId=()=>"#"+String(cases.reduce((m,c)=>Math.max(m,parseInt(c.id.slice(1),10)||0),0)+1).padStart(4,"0");
const validEscrow=x=>x&&x!==ethers.ZeroHash;
function needChain(k){ if(!signer){ setNote(k,"bad","Connect your wallet to record this on 0G."); return false; } if(!myAgent){ setNote(k,"bad","Register this wallet on 0G first (button at the top)."); return false; } return true; }
async function holdFee(slot){
  const t=await sendTx("Consult fee held", settlement.lockEscrow(myAgent, slot.addr, slot.id, {value:ethers.parseEther(BID_OG)}));
  let eid=null; try{ const e=await settlement.lastEscrowId(); if(validEscrow(e)) eid=e; }catch(e){}
  return {tx:t,eid:eid};
}
const recHash=(c,by,note,t,salt)=>ethers.keccak256(ethers.toUtf8Bytes(JSON.stringify([c.id,c.test,c.urgency,by,note,t])+salt));
async function run(a,id,c){
  if(a==="issue"){
    const ref=$("l-ref").value.trim(); if(!refOk(ref)){ setNote("lab","bad","Use a synthetic reference like PT-2041. Never enter real names or ID numbers."); return; }
    const n={id:nextId(),ref:ref,test:$("l-test").value,urgency:$("l-urg").value,owner:null,events:[]};
    let tx2=null, warn="";
    if(signer){
      if(!needChain("lab")) return;
      const slot=getSlot(); if(!slot){ setNote("lab","bad","No open slot. Ask the specialist to open one, or paste their slot code."); return; }
      let tx1; try{ setNote("lab","warn","Confirm the transactions in your wallet…"); tx1=await sendTx("Referral submitted", auction.submitBid(myAgent, slot.id, ethers.parseEther(BID_OG))); }catch(err){ setNote("lab","bad",errMsg(err)); return; }
      n.events.push({s:0,t:Date.now(),by:"Lab",tx:tx1});
      try{ const r=await holdFee(slot); tx2=r.tx; if(r.eid) n.escrowId=r.eid; }catch(err){ n.feePending=true; n.slot=slot; warn=" The referral is recorded but the fee was not held: "+errMsg(err); }
    } else n.events.push({s:0,t:Date.now(),by:"Lab",local:true});
    n.events.push({s:1,t:Date.now(),by:"System",tx:tx2,local:!tx2});
    cases.push(n); save(); pcase=n.id; selected=n.id; draft["l-ref"]=undefined;
    setNote("lab",warn?"warn":"ok","Case "+n.id+" created. "+(signer?(warn||"Referral and held fee are recorded on 0G."):"Saved in the app only. Connect a wallet to record on 0G."));
  }
  if(a==="fee"){
    if(!needChain(id)) return; const slot=c.slot||getSlot(); if(!slot){ setNote(id,"bad","Slot not found."); return; }
    try{ const r=await holdFee(slot); if(r.eid) c.escrowId=r.eid; const e1=c.events.find(e=>e.s===1); if(e1){ e1.tx=r.tx; e1.local=false; } c.feePending=false; save(); setNote(id,"ok","Fee held. Recorded on 0G."); }
    catch(err){ setNote(id,"bad",errMsg(err)); }
  }
  if(a==="slot"){
    if(!needChain("slot")) return;
    try{
      const name="gastro-slot-"+Date.now(), invId=ethers.keccak256(ethers.toUtf8Bytes(name));
      await sendTx("Slot opened", auction.listInventory(invId, myAgent, "careloop-slot-"+name, ethers.parseEther(BID_OG)));
      try{ localStorage.setItem("orvixa_inventoryId",invId); localStorage.setItem("orvixa_publisherAddr",myAddr); localStorage.setItem("orvixa_listedAt",String(Date.now())); }catch(e){}
      setNote("slot","ok","Slot open on 0G. The lab can now send a referral.");
    }catch(err){ setNote("slot","bad",errMsg(err)); }
  }
  if(a==="copy"){ const s_=localSlot(); if(!s_) return; const code=s_.id+"@"+s_.addr; try{ await navigator.clipboard.writeText(code); setNote("slot","ok","Slot code copied."); }catch(e){ prompt("Copy this slot code:",code); } }
  if(a==="acc"){ c.owner="Dr. Haddad"; addEv(c,3,c.owner,{local:true}); render(); }
  if(a==="rej"){ c.rejected=true; addEv(c,-1,"Dr. Haddad",{local:true,note:"Rejected"}); setNote(id,"warn","Rejected. The case now shows on the manager’s attention list."); }
  if(a==="reas"){ c.rejected=false; c.owner=null; addEv(c,-1,"Manager",{local:true,note:"Reassigned"}); render(); }
  if(a==="book"){ const d=dv("d-"+id,defDate()); if(!d||d<new Date().toISOString().slice(0,10)){ setNote(id,"bad","Choose an appointment date from today onwards."); return; } c.appt=d; addEv(c,4,c.owner,{local:true,note:d}); render(); }
  if(a==="att"){ addEv(c,5,c.owner,{local:true}); render(); }
  if(a==="close"){
    if(!has(c,6)){ setNote(id,"bad","The patient or the lab must confirm care was received first."); return; }
    const ev_=String(dv("n-"+id,"")).trim(), ok=!!dv("s-"+id,false);
    if(!ev_||!ok){ setNote(id,"bad","Add the evidence and tick the sign-off before closing."); return; }
    let tx=null, fp=null, extra="";
    const by=c.owner||"Clinician", tClose=Date.now(); let salt=null;
    if(signer && typeof ethers!=="undefined"){
      try{ salt=ethers.hexlify(ethers.randomBytes(16)); fp=await sendTx("Record fingerprint", signer.sendTransaction({to:myAddr,value:0,data:recHash(c,by,ev_,tClose,salt)})); }
      catch(err){ salt=null; extra=" The fingerprint was not recorded: "+errMsg(err); }
    }
    addEv(c,7,by,{t:tClose,tx:tx,fp:fp,salt:salt,local:!tx&&!fp,note:ev_}); draft["n-"+id]=undefined; draft["s-"+id]=undefined;
    setNote(id,extra?"warn":"ok","Signed off. Evidence and signer recorded."+(fp?" Fingerprint recorded.":"")+(c.escrowId?" The lab can now release the held fee.":"")+extra);
  }
  if(a==="confp"||a==="confl"){ addEv(c,6,a==="confp"?"Patient":"Lab",{local:true}); render(); }
  if(a==="verify"){
    const e=c.events.find(x=>x.s===7&&x.fp); if(!e||!e.salt){ setNote("v"+id,"warn","No fingerprint stored for this case."); return; }
    try{
      setNote("v"+id,"warn","Checking 0G…");
      const prov=provider||new ethers.JsonRpcProvider("https://evmrpc.0g.ai"), t=await prov.getTransaction(e.fp);
      const mine=recHash(c,e.by,e.note,e.t,e.salt);
      setNote("v"+id,t&&String(t.data).toLowerCase()===mine.toLowerCase()?"ok":"bad",t&&String(t.data).toLowerCase()===mine.toLowerCase()?"Verified. This record matches the fingerprint stored on 0G. It has not been changed.":"Mismatch. This record is different from the fingerprint stored on 0G.");
    }catch(err){ setNote("v"+id,"bad","Could not check 0G: "+errMsg(err)); }
  }
  if(a==="rel"){
    if(!needChain(id)) return;
    const e=c.events.find(x=>x.s===7); if(!e||!c.escrowId){ setNote(id,"bad","This case has no held fee to release."); return; }
    try{ setNote(id,"warn","Confirm the release in your wallet…"); const h=await sendTx("Fee released to specialist", settlement.releasePayment(c.escrowId)); e.tx=h; e.local=false; c.released=true; save(); setNote(id,"ok","Fee released. Recorded on 0G."); }
    catch(err){ setNote(id,"bad",errMsg(err)); }
  }
  if(a==="help"){ c.help=true; addEv(c,-1,"Patient",{local:true,note:"Asked for help"}); render(); }
  if(a==="helpdone"){ c.help=false; addEv(c,-1,"Care team",{local:true,note:"Help request handled"}); render(); }
  if(a==="pladd"){
    const ref=String(dv("pl-ref","")).trim(); if(!refOk(ref)){ setNote("pl","bad","Use a synthetic reference like PT-2095. Never enter real names or ID numbers."); return; }
    const hrs=parseInt(dv("pl-due","48 h"),10)||48;
    labs.push({id:"L-"+String(labs.reduce((m,l)=>Math.max(m,parseInt(String(l.id).slice(2),10)||0),0)+1).padStart(2,"0"),ref:ref,test:dv("pl-test","FIT positive"),due:Date.now()+hrs*H,status:"pending"});
    saveLabs(); draft["pl-ref"]=undefined; setNote("pl","ok","Added. You will get an alert if it is late.");
  }
  if(a==="plrec"){ const l=labs.find(x=>x.id===id); if(!l) return; l.status="received"; l.receivedAt=Date.now(); saveLabs(); setNote("pl","ok","Marked received. Tap “Use in form” to issue it as a case."); }
  if(a==="plissue"){ const l=labs.find(x=>x.id===id); if(!l) return; draft["l-ref"]=l.ref; draft["l-test"]=l.test; setNote("pl","ok","The issue form above now has "+l.ref+"."); }
  if(a==="und"){ addEv(c,2,"Patient",{local:true}); render(); }
}
async function act(a,id){ if(busy) return; busy=true; try{ await run(a,id,cases.find(x=>x.id===id)); }catch(err){ setNote(id||"lab","bad",errMsg(err)); }finally{ busy=false; } }
function rec(e){ const k=e.target.dataset&&e.target.dataset.k; if(k) draft[k]=e.target.type==="checkbox"?e.target.checked:e.target.value; }
document.addEventListener("click",function(e){
  const t=e.target.closest("[data-act]");
  if(t){ const a=t.dataset.act;
    if(a==="sel"){ selected=t.dataset.id; render(); return; }
    if(a==="lang"){ lang=t.dataset.l; render(); return; }
    if(a==="pc") return; act(a,t.dataset.id); }
  const tb=e.target.closest("#tabs button"); if(tb){ switchTab(tb.dataset.v); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Enter"){ const r=e.target.closest&&e.target.closest('[data-act="sel"]'); if(r){ selected=r.dataset.id; render(); } } });
document.addEventListener("input",rec);
document.addEventListener("change",function(e){ rec(e); if(e.target.dataset&&e.target.dataset.act==="pc"){ pcase=e.target.value; render(); } });
window.addEventListener("load",function(){
  $("connect-wallet-btn").addEventListener("click",connectWallet);
  $("reset").addEventListener("click",function(){ if(confirm("Reset all demo cases to the starting data?")){ cases=seed(); save(); note={}; selected=null; pcase=null; render(); } });
  if(window.ethereum){
    window.ethereum.request({method:"eth_accounts"}).then(a=>{ if(a.length) connectWallet(); }).catch(()=>{});
    window.ethereum.on("accountsChanged",a=>{ if(a&&a.length) connectWallet(); else disconnectWallet(); });
    window.ethereum.on("chainChanged",()=>location.reload());
  }
  initChat();
  window.addEventListener("resize",function(){ placeInd(true); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ placeInd(true); });
  render();
});
</script>
